<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบวิชาวิทยาศาสตร์เพื่ออาชีพธุรกิจและบริการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7a1f3d;
    --maroon-dark:#5a1530;
    --maroon-light:#9c2c52;
    --green-ok:#2e7d4f;
    --red-bad:#c0392b;
    --bg:#f4efe9;
    --card:#ffffff;
    --border:#e4dcd3;
    --text:#33282b;
    --muted:#8a7a80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Kanit',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px 60px;
  }
  .wrap{width:100%;max-width:760px;}
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:1.5rem;
    font-weight:600;
    color:var(--maroon-dark);
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:0.95rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    box-shadow:0 4px 18px rgba(122,31,61,0.06);
    margin-bottom:20px;
  }
  .screen{display:none;}
  .screen.active{display:block;}

  /* --- Chapter select --- */
  .chapter-list{display:flex;flex-direction:column;gap:12px;margin:20px 0;}
  .chapter-option{
    display:flex;
    align-items:center;
    gap:14px;
    border:2px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .chapter-option:hover{border-color:var(--maroon-light);}
  .chapter-option.checked{
    border-color:var(--maroon);
    background:#fbf1f4;
  }
  .chapter-option input{
    width:20px;height:20px;accent-color:var(--maroon);flex-shrink:0;
  }
  .chapter-option .info b{display:block;font-size:1rem;color:var(--maroon-dark);}
  .chapter-option .info span{font-size:0.85rem;color:var(--muted);}

  .select-actions{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .link-btn{
    background:none;border:none;color:var(--maroon);
    font-family:'Kanit',sans-serif;font-size:0.85rem;cursor:pointer;
    text-decoration:underline;padding:4px 0;
  }

  button.primary{
    display:block;width:100%;
    background:var(--maroon);
    color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:1.05rem;font-weight:500;
    font-family:'Kanit',sans-serif;
    cursor:pointer;transition:background .15s;
    margin-top:8px;
  }
  button.primary:hover{background:var(--maroon-dark);}
  button.primary:disabled{background:#c9b9c0;cursor:not-allowed;}

  button.secondary{
    display:block;width:100%;
    background:#fff;
    color:var(--maroon);border:2px solid var(--maroon);border-radius:12px;
    padding:12px;font-size:1rem;font-weight:500;
    font-family:'Kanit',sans-serif;
    cursor:pointer;transition:all .15s;
    margin-top:10px;
  }
  button.secondary:hover{background:#fbf1f4;}

  /* --- Quiz screen --- */
  .quiz-topbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;font-size:0.9rem;color:var(--muted);
  }
  .progress-bar{
    height:8px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:20px;
  }
  .progress-fill{
    height:100%;background:var(--maroon);width:0%;transition:width .2s;
  }
  .q-block{
    border-bottom:1px solid var(--border);
    padding-bottom:22px;margin-bottom:22px;
  }
  .q-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-tag{
    display:inline-block;background:#fbf1f4;color:var(--maroon);
    font-size:0.75rem;font-weight:500;padding:2px 10px;border-radius:999px;
    margin-bottom:8px;
  }
  .q-text{font-size:1.02rem;font-weight:500;margin:0 0 14px;line-height:1.5;}
  .choice{
    display:flex;align-items:flex-start;gap:10px;
    border:1.5px solid var(--border);border-radius:10px;
    padding:11px 14px;margin-bottom:9px;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .choice:hover{border-color:var(--maroon-light);}
  .choice.selected{border-color:var(--maroon);background:#fbf1f4;}
  .choice input{margin-top:3px;accent-color:var(--maroon);flex-shrink:0;}
  .choice label{cursor:pointer;line-height:1.45;}

  /* --- Result screen --- */
  .score-hero{
    text-align:center;padding:20px 10px 26px;
  }
  .score-circle{
    width:140px;height:140px;border-radius:50%;
    border:8px solid var(--maroon);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:0 auto 16px;
  }
  .score-circle b{font-size:2rem;color:var(--maroon-dark);line-height:1;}
  .score-circle span{font-size:0.8rem;color:var(--muted);margin-top:4px;}
  .score-msg{font-size:1.1rem;font-weight:500;color:var(--maroon-dark);}

  .review-item{
    border:1.5px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:12px;
  }
  .review-item.correct{border-color:var(--green-ok);background:#f2f9f4;}
  .review-item.wrong{border-color:var(--red-bad);background:#fdf2f1;}
  .review-head{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:0.8rem;font-weight:500;
  }
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;color:#fff;font-size:0.8rem;flex-shrink:0;
  }
  .badge.ok{background:var(--green-ok);}
  .badge.no{background:var(--red-bad);}
  .review-q{font-weight:500;margin:0 0 10px;line-height:1.5;}
  .review-line{font-size:0.92rem;margin:3px 0;line-height:1.5;}
  .review-line b{font-weight:600;}
  .your-ans.wrong-text{color:var(--red-bad);}
  .your-ans.ok-text{color:var(--green-ok);}
  .correct-ans{color:var(--green-ok);}

  .filter-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filter-tab{
    border:1.5px solid var(--border);background:#fff;color:var(--muted);
    border-radius:999px;padding:6px 16px;font-size:0.85rem;
    cursor:pointer;font-family:'Kanit',sans-serif;
  }
  .filter-tab.active{background:var(--maroon);border-color:var(--maroon);color:#fff;}

  .empty-note{
    text-align:center;color:var(--muted);padding:20px;font-size:0.95rem;
  }
  .warn{
    color:var(--red-bad);font-size:0.85rem;text-align:center;margin-top:6px;min-height:18px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>วิทยาศาสตร์เพื่ออาชีพธุรกิจและบริการ</h1>
    <p>แบบทดสอบท้ายบท — เลือกบทที่ต้องการทดสอบ</p>
  </header>

  <!-- SCREEN 1: เลือกบท -->
  <div id="screen-select" class="screen active">
    <div class="card">
      <div class="select-actions">
        <button class="link-btn" onclick="selectAll(true)">เลือกทั้งหมด</button>
        <button class="link-btn" onclick="selectAll(false)">ยกเลิกทั้งหมด</button>
      </div>
      <div class="chapter-list" id="chapter-list"></div>
      <button class="primary" id="start-btn" onclick="startQuiz()">เริ่มทำแบบทดสอบ</button>
      <div class="warn" id="select-warn"></div>
    </div>
  </div>

  <!-- SCREEN 2: ทำแบบทดสอบ -->
  <div id="screen-quiz" class="screen">
    <div class="card">
      <div class="quiz-topbar">
        <span id="quiz-title-label">แบบทดสอบ</span>
        <span id="answered-count">ตอบแล้ว 0/0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div id="quiz-questions"></div>
      <button class="primary" id="submit-btn" onclick="submitQuiz()">ส่งคำตอบและตรวจ</button>
      <div class="warn" id="submit-warn"></div>
    </div>
  </div>

  <!-- SCREEN 3: ผลลัพธ์ -->
  <div id="screen-result" class="screen">
    <div class="card score-hero">
      <div class="score-circle">
        <b id="score-number">0/0</b>
        <span>คะแนนที่ได้</span>
      </div>
      <div class="score-msg" id="score-msg"></div>
    </div>

    <div class="card">
      <div class="filter-tabs">
        <button class="filter-tab active" data-f="all" onclick="setFilter('all')">ทั้งหมด</button>
        <button class="filter-tab" data-f="wrong" onclick="setFilter('wrong')">ตอบผิด</button>
        <button class="filter-tab" data-f="correct" onclick="setFilter('correct')">ตอบถูก</button>
      </div>
      <div id="review-list"></div>
      <div class="empty-note" id="review-empty" style="display:none;">ไม่มีข้อในหมวดนี้ 🎉</div>
    </div>

    <button class="primary" onclick="retrySameChapters()">ทำแบบทดสอบชุดนี้อีกครั้ง</button>
    <button class="secondary" onclick="backToSelect()">เลือกบทใหม่</button>
  </div>
</div>

<script>
/* ================= ข้อมูลคำถามแต่ละบท ================= */
const CHAPTERS = [
  {
    id: 1,
    name: "บทที่ 1",
    topic: "ความหลากหลายทางชีวภาพ",
    questions: [
      {q:"ข้อใด ไม่จัด เป็นความหลากหลายทางชีวภาพ", choices:[
        "สวนป่าในชุมชนมีพืช 35 ชนิด สัตว์ปีก 15 ชนิด สัตว์เลื้อยคลาน 8 ชนิด",
        "ค่างแว่น เป็นสัตว์ที่มีอยู่จำนวนมากที่เขาสามร้อยยอด จังหวัดประจวบคีรีขันธ์",
        "ป่าไม้ในประเทศไทยมีทั้งป่าดิบชื้น ป่าดิบเขา ป่าพรุ ป่าเต็งรัง ป่าเบญจพรรณ",
        "หมอนทอง ก้านยาว ชะนี เป็นพันธุ์ทุเรียนที่ปลูกในประเทศไทย"], answer:1},
      {q:"ข้อใดเป็นความหลากหลายทางชนิดพันธุ์", choices:[
        "ในป่าชายเลนจะพบ ปูแสม ปลาตีน ปูดำ",
        "ในตู้เลี้ยงปลามีปลาหางนกยูง ตัวผู้ 10 ตัว ตัวเมีย 20 ตัว",
        "ในนาข้าว 20 ไร่ มีข้าวพันธุ์ กข.1 เต็มพื้นที่",
        "ในบ่อเลี้ยงกบมีกบ 50 ตัว"], answer:0},
      {q:"ข้อใดเป็นความหลากหลายทางพันธุกรรม", choices:[
        "ในป่าดิบชื้นมีพืชขึ้นหนาแน่น",
        "ข้าวเจ้าในประเทศไทยมีหลายสายพันธุ์",
        "ระบบนิเวศในหนองน้ำข้างบ้านมีปลากระดี่จำนวนมากที่สุด",
        "เฟิร์นเป็นพืชที่พบได้มากในระบบนิเวศป่าดิบชื้น"], answer:1},
      {q:"แมวเปอร์เซีย แมวโคราช แมวขาวมณี จัดเป็นความหลากหลายทางชีวภาพระดับใด", choices:[
        "ความหลากหลายของระบบนิเวศ",
        "ความหลากหลายของเชื้อชาติ",
        "ความหลากหลายของชนิดพันธุ์",
        "ความหลากหลายทางพันธุกรรม"], answer:3},
      {q:"พืชที่จัดว่าเป็นพืชเด่นที่ไม่ผลัดใบที่พบในป่าดิบชื้นทางภาคใต้คือพืชชนิดใด", choices:["ไผ่","หวาย","ตะเคียน","สัก"], answer:2},
      {q:"ป่าไม้ในข้อใดจัดเป็นป่าไม้ผลัดใบ", choices:["ป่าดิบเขา","ป่าพรุ","ป่าเบญจพรรณ","ป่าดิบชื้น"], answer:2},
      {q:"ข้อใด ไม่ใช่ การปรับตัวของสิ่งมีชีวิตเพื่ออาศัยอยู่ในเขตน้ำไหลเชี่ยว", choices:[
        "มีโครงสร้างพิเศษสำหรับเกาะหรือดูดพื้นผิว",
        "สร้างเมือกสำหรับยึดเกาะ",
        "ปรับตัวให้รูปร่างเพรียวขึ้น",
        "ปรับสีผิวให้กลมกลืนกับพื้น"], answer:3},
      {q:"ปัจจุบันสัตว์ป่าสงวนในประเทศไทยมีกี่ชนิด", choices:["15 ชนิด","18 ชนิด","20 ชนิด","22 ชนิด"], answer:2},
      {q:"นกที่พบในป่าชายเลนมีหลายชนิด ยกเว้น นกชนิดใด", choices:["นกยางเปีย","เหยี่ยวแดง","นกแต้วแล้ว","นกกาน้ำ"], answer:3},
      {q:"สิ่งมีชีวิตในระบบนิเวศแหล่งน้ำเค็มที่จัดเป็นกลุ่มเนกตอน คือสิ่งมีชีวิตในข้อใด", choices:[
        "สิ่งมีชีวิตที่ว่ายน้ำด้วยตนเองหากินในทะเล",
        "สิ่งมีชีวิตขนาดเล็กที่ล่องลอยในกระแสน้ำ",
        "สิ่งมีชีวิตที่ดำรงชีวิตตามพื้นทะเล",
        "สิ่งมีชีวิตขนาดใหญ่ที่กินทั้งพืชและสัตว์เป็นอาหาร"], answer:0},
      {q:"สิ่งมีชีวิตในข้อใดจัดเป็นกลุ่มเบนทอส", choices:[
        "ปลาฉลาม พยูน",
        "ปะการัง ดาวทะเล หอย",
        "แพลงก์ตอนพืช แพลงก์ตอนสัตว์",
        "ปูก้ามดาบ ฟองน้ำ เต่า"], answer:3},
      {q:"การจำแนกสิ่งมีชีวิตออกเป็นหมวดหมู่จากใหญ่ไปเล็ก สิ่งมีชีวิตในหมวดหมู่ใดที่เล็กที่สุด", choices:["คลาส","สปีชีส์","สกุล","ไฟลัม"], answer:1},
      {q:"สิ่งมีชีวิตในอาณาจักรมอเนอรามีลักษณะเด่นที่สำคัญอย่างไร", choices:[
        "เซลล์เดียว มีเยื่อหุ้มนิวเคลียส",
        "เซลล์เดียว ไม่มีเยื่อหุ้มนิวเคลียส",
        "ไม่มีคลอโรฟิลล์ สืบพันธุ์โดยการสร้างสปอร์",
        "มีคลอโรฟิลล์ สร้างอาหารเองได้"], answer:1},
      {q:"เห็ด รา ยีสต์ จัดเป็นสิ่งมีชีวิตอยู่ในกลุ่มใด", choices:["อาณาจักรโพรติสตา","อาณาจักรพืช","อาณาจักรฟังไจ","อาณาจักรมอเนอรา"], answer:2},
      {q:'ข้อใด ไม่ถูกต้อง เมื่อกล่าวถึงพืชประเภทอิงอาศัยที่เรียกกันทั่วไปว่า "ชายผ้าสีดา"', choices:[
        "เป็นพืชที่สืบพันธุ์โดยสปอร์",
        "เป็นพืชที่มีท่อลำเลียงน้ำ และท่อลำเลียงอาหาร",
        "เป็นพืชกลุ่มเดียวกับข้าหลวงหลังลาย",
        "เป็นพืชกลุ่มเดียวกับมอส ลิเวอร์เวิร์ต"], answer:3},
      {q:"ข้อใดจัดเป็นสิ่งมีชีวิตที่อยู่ในกลุ่มเดียวกัน ตามระบบการแบ่งหมวดหมู่สิ่งมีชีวิต", choices:[
        "หอย ปลาหมึก",
        "ฟองน้ำ ดอกไม้ทะเล",
        "พยาธิใบไม้ในตับ พยาธิใส้เดือน",
        "ปะการัง แมงกะพรุน"], answer:3},
      {q:"ปลาชนิดใดจัดเป็นปลากระดูกอ่อน", choices:["ปลาการ์ตูน","ปลาเนื้ออ่อน","ปลากระเบน","ปลาดุกเนื้ออ่อน"], answer:2},
      {q:"สัตว์ชนิดใดที่เลี้ยงลูกด้วยน้ำนมและออกลูกเป็นไข่", choices:["นากทะเล","ตุ่นปากเป็ด","โคอาลา","จิงโจ้"], answer:0},
      {q:"ข้อใดเป็นการใช้ประโยชน์จากความหลากหลายทางชีวภาพได้อย่างพอประมาณ", choices:[
        "สมศรีเก็บเห็ดจากป่ามาประกอบอาหาร",
        "สมชายตัดไม้มะค่ามาทำเฟอร์นิเจอร์ขาย",
        "สมพรเก็บกล้วยไม้ป่ามาขายหารายได้",
        "สมพงษ์เข้าไปตั้งแคมป์เล่นดนตรีในเขตอุทยาน"], answer:0},
      {q:"ข้อใดเป็นการรักษาความหลากหลายทางชีวภาพของชนิดสิ่งมีชีวิต", choices:[
        "การปลูกพืช GMOs",
        "การนำกบป่ามาเลี้ยงเป็นสัตว์เลี้ยง",
        "การปลูกพืชเศรษฐกิจเชิงเดี่ยว",
        "การจัดให้มีสวนป่าชุมชน"], answer:3}
    ]
  },
  {
    id: 2,
    name: "บทที่ 2",
    topic: "สารชีวโมเลกุล",
    questions: [

/* ================= state ================= */
let quizPool = [];      // [{chapterId, chapterName, q, choices, answer}]
let userAnswers = [];   // parallel array, index or null
let currentFilter = "all";
let lastSelectedChapterIds = [];

const THAI_LETTERS = ["ก","ข","ค","ง"];

/* ================= init: render chapter selector ================= */
function renderChapterList(){
  const list = document.getElementById("chapter-list");
  list.innerHTML = "";
  CHAPTERS.forEach(ch=>{
    const div = document.createElement("label");
    div.className = "chapter-option";
    div.innerHTML = `
      <input type="checkbox" value="${ch.id}" onchange="onChapterToggle(this)">
      <div class="info">
        <b>${ch.name}: ${ch.topic}</b>
        <span>${ch.questions.length} ข้อ</span>
      </div>`;
    list.appendChild(div);
  });
}
function onChapterToggle(el){
  el.closest(".chapter-option").classList.toggle("checked", el.checked);
  document.getElementById("select-warn").textContent = "";
}
function selectAll(state){
  document.querySelectorAll("#chapter-list input[type=checkbox]").forEach(cb=>{
    cb.checked = state;
    cb.closest(".chapter-option").classList.toggle("checked", state);
  });
}

/* ================= start quiz ================= */
function startQuiz(){
  const checked = Array.from(document.querySelectorAll("#chapter-list input:checked")).map(cb=>parseInt(cb.value));
  if(checked.length === 0){
    document.getElementById("select-warn").textContent = "กรุณาเลือกอย่างน้อย 1 บท ก่อนเริ่มทำแบบทดสอบ";
    return;
  }
  lastSelectedChapterIds = checked;
  buildPool(checked);
  renderQuiz();
  showScreen("screen-quiz");
}

function buildPool(chapterIds){
  quizPool = [];
  chapterIds.forEach(id=>{
    const ch = CHAPTERS.find(c=>c.id===id);
    ch.questions.forEach(qu=>{
      quizPool.push({
        chapterLabel: ch.name,
        q: qu.q,
        choices: qu.choices,
        answer: qu.answer
      });
    });
  });
  userAnswers = new Array(quizPool.length).fill(null);
}

function renderQuiz(){
  const names = lastSelectedChapterIds.map(id=>CHAPTERS.find(c=>c.id===id).name).join(", ");
  document.getElementById("quiz-title-label").textContent = "ทดสอบ: " + names;
  updateAnsweredCount();

  const container = document.getElementById("quiz-questions");
  container.innerHTML = "";
  quizPool.forEach((item, idx)=>{
    const block = document.createElement("div");
    block.className = "q-block";
    let choicesHtml = "";
    item.choices.forEach((c, ci)=>{
      choicesHtml += `
        <div class="choice" id="choice-${idx}-${ci}" onclick="selectAnswer(${idx}, ${ci})">
          <input type="radio" name="q${idx}" id="radio-${idx}-${ci}" onclick="selectAnswer(${idx}, ${ci})">
          <label for="radio-${idx}-${ci}">${THAI_LETTERS[ci]}. ${c}</label>
        </div>`;
    });
    block.innerHTML = `
      <span class="q-tag">${item.chapterLabel} • ข้อ ${idx+1}</span>
      <p class="q-text">${idx+1}. ${item.q}</p>
      ${choicesHtml}`;
    container.appendChild(block);
  });
}

function selectAnswer(qIdx, choiceIdx){
  userAnswers[qIdx] = choiceIdx;
  for(let i=0;i<4;i++){
    const el = document.getElementById(`choice-${qIdx}-${i}`);
    if(el) el.classList.toggle("selected", i===choiceIdx);
  }
  const radio = document.getElementById(`radio-${qIdx}-${choiceIdx}`);
  if(radio) radio.checked = true;
  updateAnsweredCount();
}

function updateAnsweredCount(){
  const answered = userAnswers.filter(a=>a!==null).length;
  document.getElementById("answered-count").textContent = `ตอบแล้ว ${answered}/${quizPool.length}`;
  const pct = quizPool.length ? (answered/quizPool.length*100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
}

/* ================= submit & score ================= */
function submitQuiz(){
  const unanswered = userAnswers.filter(a=>a===null).length;
  if(unanswered > 0){
    document.getElementById("submit-warn").textContent = `ยังเหลือ ${unanswered} ข้อที่ยังไม่ได้ตอบ กรุณาตอบให้ครบก่อนส่งคำตอบ`;
    return;
  }
  document.getElementById("submit-warn").textContent = "";
  showResult();
}

function showResult(){
  let correctCount = 0;
  quizPool.forEach((item, idx)=>{
    if(userAnswers[idx] === item.answer) correctCount++;
  });
  const total = quizPool.length;
  document.getElementById("score-number").textContent = `${correctCount}/${total}`;

  const pct = total ? (correctCount/total*100) : 0;
  let msg;
  if(pct === 100) msg = "ยอดเยี่ยมมาก! ตอบถูกทุกข้อ 🎉";
  else if(pct >= 80) msg = "เก่งมาก! ทำได้ดีเยี่ยม";
  else if(pct >= 60) msg = "ทำได้ดี ลองทบทวนข้อที่ผิดอีกนิด";
  else msg = "ควรกลับไปทบทวนเนื้อหาเพิ่มเติมนะ สู้ ๆ!";
  document.getElementById("score-msg").textContent = msg;

  currentFilter = "all";
  document.querySelectorAll(".filter-tab").forEach(t=>t.classList.toggle("active", t.dataset.f==="all"));
  renderReview();
  showScreen("screen-result");
}

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll(".filter-tab").forEach(t=>t.classList.toggle("active", t.dataset.f===f));
  renderReview();
}

function renderReview(){
  const list = document.getElementById("review-list");
  const emptyNote = document.getElementById("review-empty");
  list.innerHTML = "";
  let shown = 0;

  quizPool.forEach((item, idx)=>{
    const userIdx = userAnswers[idx];
    const isCorrect = userIdx === item.answer;
    if(currentFilter === "wrong" && isCorrect) return;
    if(currentFilter === "correct" && !isCorrect) return;
    shown++;

    const div = document.createElement("div");
    div.className = "review-item " + (isCorrect ? "correct" : "wrong");
    const userText = item.choices[userIdx];
    const correctText = item.choices[item.answer];
    div.innerHTML = `
      <div class="review-head">
        <span class="badge ${isCorrect?'ok':'no'}">${isCorrect?'✓':'✕'}</span>
        <span>${item.chapterLabel} • ข้อ ${idx+1}</span>
      </div>
      <p class="review-q">${item.q}</p>
      <p class="review-line">คำตอบของคุณ: <b class="your-ans ${isCorrect?'ok-text':'wrong-text'}">${THAI_LETTERS[userIdx]}. ${userText}</b></p>
      ${isCorrect ? "" : `<p class="review-line">คำตอบที่ถูกต้อง: <b class="correct-ans">${THAI_LETTERS[item.answer]}. ${correctText}</b></p>`}
    `;
    list.appendChild(div);
  });

  emptyNote.style.display = shown === 0 ? "block" : "none";
}

/* ================= navigation ================= */
function retrySameChapters(){
  buildPool(lastSelectedChapterIds);
  renderQuiz();
  document.getElementById("submit-warn").textContent = "";
  showScreen("screen-quiz");
  window.scrollTo({top:0, behavior:"smooth"});
}

function backToSelect(){
  showScreen("screen-select");
  document.getElementById("select-warn").textContent = "";
  window.scrollTo({top:0, behavior:"smooth"});
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ================= boot ================= */
renderChapterList();
</script>
</body>
</html>
